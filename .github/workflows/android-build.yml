name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare optional release signing
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: |
          set -euo pipefail

          provided=0
          for value in "$ANDROID_KEYSTORE_BASE64" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD"; do
            if [[ -n "$value" ]]; then
              provided=$((provided + 1))
            fi
          done

          if [[ "$provided" -eq 4 ]]; then
            keystore="$RUNNER_TEMP/parts-market-release.jks"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
            chmod 600 "$keystore"

            {
              echo "ANDROID_KEYSTORE_PATH=$keystore"
              echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
            } >> "$GITHUB_ENV"

            echo "release_signed=true" >> "$GITHUB_OUTPUT"
            echo "release_artifact_name=parts-market-release-signed" >> "$GITHUB_OUTPUT"
            echo "Release signing key found; the release APK will be signed."
          elif [[ "$provided" -eq 0 ]]; then
            echo "release_signed=false" >> "$GITHUB_OUTPUT"
            echo "release_artifact_name=parts-market-release-unsigned" >> "$GITHUB_OUTPUT"
            echo "No release signing secrets found; the release APK will be unsigned."
          else
            echo "Release signing secrets are incomplete. Configure all four secrets or remove all four."
            exit 1
          fi

      - name: Validate release keystore credentials
        if: steps.signing.outputs.release_signed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          csr="$RUNNER_TEMP/parts-market-key-check.csr"
          trap 'rm -f "$csr"' EXIT

          echo "Checking decoded keystore file..."
          ls -l "$ANDROID_KEYSTORE_PATH"
          file "$ANDROID_KEYSTORE_PATH"
          echo "Decoded byte count: $(wc -c < "$ANDROID_KEYSTORE_PATH")"
          echo "Decoded SHA-256 (safe to compare; does not reveal the key):"
          sha256sum "$ANDROID_KEYSTORE_PATH"
          echo "First 16 bytes (format marker only):"
          od -An -tx1 -N16 "$ANDROID_KEYSTORE_PATH"

          echo "Checking keystore password, format, and alias..."
          valid_store_type=""
          for store_type in PKCS12 JKS; do
            if keytool -list \
              -storetype "$store_type" \
              -keystore "$ANDROID_KEYSTORE_PATH" \
              -storepass:env ANDROID_KEYSTORE_PASSWORD \
              -alias "$ANDROID_KEY_ALIAS" >"$RUNNER_TEMP/keytool-list-$store_type.out" 2>"$RUNNER_TEMP/keytool-list-$store_type.err"; then
              valid_store_type="$store_type"
              break
            fi
          done
          if [[ -z "$valid_store_type" ]]; then
            echo "::error::Keystore validation failed for both PKCS12 and JKS. Safe diagnostics follow:"
            cat "$RUNNER_TEMP/keytool-list-PKCS12.out" "$RUNNER_TEMP/keytool-list-PKCS12.err"
            cat "$RUNNER_TEMP/keytool-list-JKS.out" "$RUNNER_TEMP/keytool-list-JKS.err"
            exit 1
          fi
          echo "Keystore validation passed using store type: $valid_store_type"

          echo "Checking private-key password..."
          if ! keytool -certreq \
            -alias "$ANDROID_KEY_ALIAS" \
            -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD \
            -keypass:env ANDROID_KEY_PASSWORD \
            -file "$csr" >"$RUNNER_TEMP/keytool-key.out" 2>"$RUNNER_TEMP/keytool-key.err"; then
            echo "::error::Private-key validation failed. Safe keytool diagnostic follows:"
            cat "$RUNNER_TEMP/keytool-key.out" "$RUNNER_TEMP/keytool-key.err"
            exit 1
          fi
          echo "Private-key password check passed."

      - name: Build debug and release APKs
        working-directory: android
        run: gradle assembleDebug assembleRelease

      - name: Verify release APK signature
        if: steps.signing.outputs.release_signed == 'true'
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs \
            android/app/build/outputs/apk/release/app-release.apk

      - name: Check APK alignment and Android package metadata
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          APK="android/app/build/outputs/apk/release/app-release.apk"

          "$ZIPALIGN" -c -v 4 "$APK"
          "$AAPT" dump badging "$APK" | tee "$RUNNER_TEMP/parts-market-badging.txt"

          grep -F "package: name='com.partsmarket.app' versionCode='1' versionName='1.0.0'" "$RUNNER_TEMP/parts-market-badging.txt"
          grep -F "sdkVersion:'23'" "$RUNNER_TEMP/parts-market-badging.txt"
          grep -F "targetSdkVersion:'35'" "$RUNNER_TEMP/parts-market-badging.txt"

      - name: Install debug and signed release APKs on Android 13 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -euo pipefail
            echo "Emulator Android API: $(adb shell getprop ro.build.version.sdk)"
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            adb shell pm path com.partsmarket.app
            adb shell monkey -p com.partsmarket.app 1
            adb uninstall com.partsmarket.app

            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell pm path com.partsmarket.app
            adb shell monkey -p com.partsmarket.app 1
            adb uninstall com.partsmarket.app

      - name: Add APK validation summary
        if: always()
        shell: bash
        run: |
          {
            echo ""
            echo "## APK installation validation"
            echo "- APK alignment and package metadata are checked before upload."
            if [[ "${{ job.status }}" == "success" ]]; then
              echo "- Debug and signed release APKs installed and launched on an Android 13 emulator."
            else
              echo "- APK validation or emulator installation failed; inspect the step above for the exact error."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: parts-market-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.signing.outputs.release_artifact_name }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Add build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Parts Market Android build"
            echo "- Debug APK: uploaded as parts-market-debug-apk"
            if [[ "${{ steps.signing.outputs.release_signed }}" == "true" ]]; then
              echo "- Release APK: signed and signature verification was requested"
            else
              echo "- Release APK: unsigned; it is not ready for normal installation"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/parts-market-release.jks"
