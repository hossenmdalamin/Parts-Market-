name: Universal Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install required Android packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare release signing
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          count=0
          for value in "$ANDROID_KEYSTORE_BASE64" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD"; do
            [[ -n "$value" ]] && count=$((count + 1))
          done
          if [[ "$count" -ne 4 ]]; then
            echo "::error::All four release-signing secrets must be configured. Do not distribute unsigned APKs."
            exit 1
          fi
          path="$RUNNER_TEMP/parts-market-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$path"
          chmod 600 "$path"
          {
            echo "ANDROID_KEYSTORE_PATH=$path"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Validate signing key
        if: github.event_name != 'pull_request'
        run: keytool -list -keystore "$ANDROID_KEYSTORE_PATH" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS"

      - name: Build debug APK for pull requests
        if: github.event_name == 'pull_request'
        working-directory: android
        run: gradle assembleDebug

      - name: Build signed release and debug APKs
        if: github.event_name != 'pull_request'
        working-directory: android
        run: gradle assembleRelease assembleDebug

      - name: Verify signed universal release APK
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/badging.txt"
          grep -F "package: name='com.partsmarket.app'" "$RUNNER_TEMP/badging.txt"
          grep -F "sdkVersion:'23'" "$RUNNER_TEMP/badging.txt"
          grep -F "targetSdkVersion:'35'" "$RUNNER_TEMP/badging.txt"

      - name: Upload signed universal release APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: parts-market-universal-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: parts-market-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Add build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Parts Market Android build"
            echo "- APK is built as a single package without ABI splits."
            echo "- Minimum Android version: Android 6.0 (API 23)."
            echo "- Emulator boot is not a prerequisite for building or uploading APK artifacts."
            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              echo "- Pull request validation builds the debug APK only."
            else
              echo "- Release APK signing and package metadata are verified before upload."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/parts-market-release.jks"
